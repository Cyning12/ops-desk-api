schema_version: "inform_graph.v3"
graph_id: "10_flow_lg_rag"
title: "LG RAG 旁路三模式流程（basic / router / supervisor）"
description: "POST /api/ops/lg-rag/invoke 按 mode 分派三图：basic（START→rag→END）/ router（三路 + evaluate⇄rewrite 回环 ≤2）/ supervisor（拆解→分派→聚合）。同图分节：节点 id 前缀 b_/r_/s_；rag 路径黑盒复用 lc_evidence_chain，不展开 LCEL；默认不进入 chat/graph。freeze lg-rag-http-v1。"
version: "2026-08-26"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

nodes:
  - id: "client"
    label: "用户 / 前端"
    kind: external

  - id: "lg_invoke"
    label: "POST /api/ops/lg-rag/invoke（freeze lg-rag-http-v1）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/router.py"
        symbol: "invoke_lg_rag"
        kind: method
      - path: "app/ops/lg_rag/router.py"
        symbol: "_dispatch"
        kind: method

  - id: "basic_graph"
    label: "basic 图 build_basic_agent（Phase 1 对照）"
    kind: struct
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/graph.py"
        symbol: "build_basic_agent"
        kind: method

  - id: "router_graph"
    label: "router 图 build_router_agent（Phase 2-3）"
    kind: struct
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/graph.py"
        symbol: "build_router_agent"
        kind: method

  - id: "sup_graph"
    label: "supervisor 图 build_supervisor_agent（Phase 4）"
    kind: struct
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/multi/graph.py"
        symbol: "build_supervisor_agent"
        kind: method

  - id: "b_rag"
    label: "rag_node"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "rag_node"
        kind: method

  - id: "r_router"
    label: "router_node（#数字快路径 + LLM 三分类）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "router_node"
        kind: method

  - id: "r_direct"
    label: "direct_answer_node"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "direct_answer_node"
        kind: method

  - id: "r_refuse"
    label: "refuse_node（固定文案）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "refuse_node"
        kind: method

  - id: "r_rag"
    label: "rag_node（黑盒调 lc chain）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "rag_node"
        kind: method

  - id: "r_evaluate"
    label: "evaluate_node（复用 chain gate · 零额外 LLM）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "evaluate_node"
        kind: method
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "route_by_quality"
        kind: method

  - id: "r_rewrite"
    label: "rewrite_node（LLM 改写 · 熔断封顶）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "rewrite_node"
        kind: method
      - path: "app/ops/lg_rag/nodes.py"
        symbol: "route_after_rewrite"
        kind: method

  - id: "s_strategy_builder"
    label: "strategy_builder_node（S1 allowlist · Registry∩Policy）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/strategy/builder.py"
        symbol: "strategy_builder_node"
        kind: method

  - id: "s_supervisor"
    label: "supervisor_node（LLM 拆解 ≤4 · 失败 fallback 单 rag）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/multi/nodes.py"
        symbol: "supervisor_node"
        kind: method

  - id: "s_dispatch"
    label: "route_next_subtask（dispatch）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/multi/nodes.py"
        symbol: "route_next_subtask"
        kind: method

  - id: "s_rag"
    label: "rag_subtask_node（复用 router 子图）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/multi/nodes.py"
        symbol: "rag_subtask_node"
        kind: method

  - id: "s_extract"
    label: "info_extract_node"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/multi/nodes.py"
        symbol: "info_extract_node"
        kind: method

  - id: "s_tool"
    label: "tool_exec_node（Capability Gateway）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/multi/nodes.py"
        symbol: "tool_exec_node"
        kind: method

  - id: "structured_output_gw"
    label: "Structured Output Gateway（>./10_flow_structured_output.md）"
    kind: external

  - id: "capability_gw"
    label: "Capability Gateway（>./10_flow_capability.md）"
    kind: external

  - id: "s_aggregator"
    label: "aggregator_node（LLM 综合）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      - path: "app/ops/lg_rag/multi/nodes.py"
        symbol: "aggregator_node"
        kind: method

  - id: "lc_chain"
    label: "LC Evidence chain（黑盒 · 不展开 LCEL）"
    kind: external

  - id: "llm"
    label: "LLM Provider"
    kind: external

  - id: "db"
    label: "PostgreSQL"
    kind: external

  - id: "main_doc"
    label: ">../l0/00_main.md"
    kind: external

