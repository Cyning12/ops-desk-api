    mark: "?>"
    type: "branches"
    anchors:
      - path: "app/ops/lg_rag/router.py"
        line: 118

  - from: "lg_invoke"
    to: "router_graph"
    label: "[mode=router（默认）]"
    mark: "?>"
    type: "branches"
    anchors:
