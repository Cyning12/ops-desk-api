schema_version: "inform_graph.v3"
graph_id: "10_flow_rag"
title: "RAG 混合检索摘要流程（hybrid_recall）"
description: "RAG 查询侧摘要流（选项 A 独立 flow · spec modules/rag.md §3 拍板）：query → embed（bge-m3）→ hybrid_recall → dense（Qdrant 默认 | pgvector 即时降级）/ FTS·sparse 第二路（PG）→ RRF k=60 融合 →（可选）CE rerank → RetrievedChunk[] top-5；Qdrant 命中经 PG hydrate 回表取正文。ingest 侧不展开（摘要粒度）。消费方：chat/rag_nodes.retrieve_node · lc_evidence_chain。"
version: "2026-08-25"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

nodes:
  - id: "caller"
    label: "调用方（chat/rag_nodes · lc_evidence_chain）"
    kind: external

  - id: "embed_query"
    label: "query embed（bge-m3）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/embedder.py"
      symbol: "get_query_embedder"
      # also: app/ops/rag/embedder.py#ApiEmbedder (class)

  - id: "hybrid_recall"
    label: "hybrid_recall（入口）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/retrieve.py"
      symbol: "hybrid_recall"
      # also: app/ops/rag/retrieve.py#hybrid_recall_detail (method)

  - id: "backend_gate"
    label: "search_dense_with_fallback（即时降级）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/backend.py"
      symbol: "search_dense_with_fallback"

  - id: "dense_qdrant"
    label: "dense · Qdrant Cosine（默认）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/retrieve.py"
      symbol: "_semantic_search_qdrant"

  - id: "dense_pgvector"
    label: "dense · pgvector fallback"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/retrieve.py"
      symbol: "_semantic_search_pg"

  - id: "fts_pg"
    label: "FTS / sparse 第二路（PG）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/retrieve.py"
      symbol: "_keyword_query"

  - id: "hydrate"
    label: "PG hydrate（Qdrant 命中回表）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/retrievers/qdrant_retriever.py"
      symbol: "QdrantRetriever.search"

  - id: "rrf_fuse"
    label: "RRF 融合（k=60 · 两路等权）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/retrieve.py"
      symbol: "rrf_fuse"

  - id: "rerank"
    label: "rerank（可选 · CE 精排）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/rag/reranker.py"
      symbol: "rerank_chunks"

  - id: "result"
    label: "RetrievedChunk[]（fused top-5）"
    kind: external

  - id: "siliconflow"
    label: "SiliconFlow（/embeddings · /rerank）"
    kind: external

  - id: "qdrant"
    label: "Qdrant"
    kind: external

  - id: "db"
    label: "PostgreSQL（ops_knowledge_chunks）"
    kind: external

  - id: "main_doc"
    label: ">../l0/00_main.md"
    kind: external

