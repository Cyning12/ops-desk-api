schema_version: "inform_graph.v3"
graph_id: "10_flow_capability"
title: "Capability Gateway 注册与 invoke"
description: "能力进程内注册表 + Filter + 统一 invoke/ainvoke（非跨进程注册中心）；YAML/JSON manifest 加载 register（仅 local_fn · defaults/lookups 前缀）；local_fn 默认含本库 issue/PR 只读 lookup（tenant_scoped + 最小 args_schema）；可选 schemas_for_llm/ToolNode；mcp/sandbox/cli mock 探针与 skill stub 默认关闭。不是业界 LLM Gateway。首接入面：lg_rag tool_exec_node。C1（2026-09-01）：harness.verify / harness.task_lint 白名单 CLI Capability（harness_cli.py · 代码路径 gateway.register · 显式 register_harness_cli_capabilities() · Policy 默认关 · 不进默认目录；harness.status 可选未做）。阶段 H（2026-09-17）：Gateway args_schema 校验 + tenant_scoped 门 + span args/policy/subtask 摘要。治理层（2026-09-21）：执行期 _prepare_call 闸链（lookup→enabled→Policy→熔断→配额/kill→args_schema；Policy 拒不计配额）+ 写能力幂等（命中重放）+ 降级链（声明才降级/降级必带 degraded 标记 · ok=True 须同看标记）+ output_schema 输出契约 + 观测端点 /admin/capability/* + 红线 R0–R15。"
version: "2026-09-21"
layer: "G-L1"
primary_layer: "G-L1"
depth: "method"
direction: "TB"

nodes:
  - id: "caller"
    label: "调用方（lg_rag tool_exec_node）"
    kind: external

  - id: "load_manifest"
    label: "load_capability_manifest（YAML/JSON → register）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/manifest.py"
      symbol: "load_capability_manifest"

  - id: "register"
    label: "register / defaults.ensure_default_capabilities"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/gateway.py"
      symbol: "register"
      # also: app/ops/capability/defaults.py#ensure_default_capabilities (method)

  - id: "list_filter"
    label: "list_capabilities / schemas_for_llm（Filter）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/gateway.py"
      symbol: "list_capabilities"
      # also: app/ops/capability/gateway.py#schemas_for_llm (method)

  - id: "invoke"
    label: "invoke / ainvoke(capability_id, args)"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/gateway.py"
      symbol: "invoke"
      # also: app/ops/capability/gateway.py#ainvoke (method)

  - id: "pg_lookup"
    label: "lookups.get_issue/pr_by_number（本库 PG 只读）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/lookups.py"
      symbol: "get_issue_by_number"
      # also: app/ops/capability/lookups.py#get_pr_by_number (method)

  - id: "local_fn"
    label: "LocalFnAdapter"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/adapters/local_fn.py"
      symbol: "LocalFnAdapter"

  - id: "probes"
    label: "mcp / sandbox / cli probes（默认关闭）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/probes.py"
      symbol: "register_p2_probes"

  - id: "skill_stub"
    label: "skill provide/invoke stub（无完整引擎）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/gateway.py"
      symbol: "provide"
      # also: app/ops/capability/adapters/skill.py#SkillStubAdapter (class)

  - id: "result"
    label: "CapabilityResult（ok / output / error）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/types.py"
      symbol: "CapabilityResult"

  - id: "idempotency"
    label: "idempotency 防重（命中重放上次结果 · receipts 回执）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/idempotency.py"
      symbol: "get_idempotency_store"

  - id: "precheck"
    label: "_prepare_call 闸链（lookup→enabled→Policy→熔断→配额/kill→args_schema）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/gateway.py"
      symbol: "_prepare_call"

  - id: "circuit"
    label: "circuit 下游熔断（pybreaker · 写探测 · 判定不看错误文案）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/circuit.py"
      symbol: "check"
      # also: app/ops/capability/circuit.py#guard (method)

  - id: "budget"
    label: "budget 会话配额 / kill switch（Policy 拒不计配额）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/budget.py"
      symbol: "check"

  - id: "fallback"
    label: "fallback 降级链（声明才降级 · 降级必带 degraded 标记跟数据走）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/fallback.py"
      symbol: "should_degrade"

  - id: "result_contract"
    label: "result_contract 输出契约（output_schema · 违约 ok=False）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/result_contract.py"
      symbol: "validate"

  - id: "obs_admin"
    label: "观测端点 /admin/capability/{runtime,catalog,receipts,idempotency}（AdminSyncAuth · 只读）"
    kind: external

  - id: "redlines"
    label: "红线题集 R0–R15（evals/agent/redlines/capability_v1.yaml）"
    kind: external

  - id: "fc_optional"
    label: "可选 as_tool_node（不挂 multi 主路径）"
    kind: flow
    layer_hint: "G-L2"
    implementedBy:
      path: "app/ops/capability/extras/langchain.py"
      symbol: "as_tool_node"

  - id: "lg_rag_doc"
    label: ">./10_flow_lg_rag.md"
    kind: external

  - id: "modules_doc"
    label: ">./01_modules.md"
    kind: external

edges:
  - from: "load_manifest"
    to: "register"
    label: "Host register（仅 local_fn）"
    anchors:
      - path: "app/ops/capability/manifest.py"
        symbol: "load_capability_manifest"

  - from: "register"
    to: "list_filter"
    label: "编目可见"
    anchors:
      - path: "app/ops/capability/gateway.py"
        symbol: "list_capabilities"

  - from: "list_filter"
    to: "fc_optional"
    label: "可选 FC 暴露"
    mark: "?>"
    type: "branches"
    anchors:
      - path: "app/ops/capability/extras/langchain.py"
        symbol: "as_structured_tools"

  - from: "caller"
    to: "invoke"
    label: "tool 子任务"
    anchors:
      - path: "app/ops/lg_rag/multi/nodes.py"
        symbol: "tool_exec_node"

  - from: "invoke"
    to: "idempotency"
    label: "写能力先查防重"
    anchors:
      - path: "app/ops/capability/gateway.py"
        symbol: "invoke"

  - from: "idempotency"
    to: "result"
    label: "[命中 → 重放上次结果]"
    mark: "?>"
    type: "branches"
    anchors:
      - path: "app/ops/capability/idempotency.py"
        symbol: "get_idempotency_store"

  - from: "idempotency"
    to: "precheck"
    label: "[未命中/读能力 → 闸链]"

  - from: "precheck"
    to: "circuit"
    label: "熔断（写探测）"
    type: "depends_on"
    anchors:
      - path: "app/ops/capability/circuit.py"
        symbol: "check"

  - from: "precheck"
    to: "budget"
    label: "配额 / kill switch"
    type: "depends_on"
    anchors:
      - path: "app/ops/capability/budget.py"
        symbol: "check"

  - from: "precheck"
    to: "result"
    label: "[Policy/熔断/配额/形态 拦下 → ok=False（Policy 拒不计配额）]"
    mark: "?>"
    type: "branches"
    anchors:
      - path: "app/ops/capability/gateway.py"
        symbol: "_blocked_result"

  - from: "precheck"
    to: "local_fn"
    label: "过闸 dispatch kind=local_fn（默认）"
    anchors:
      - path: "app/ops/capability/gateway.py"
        symbol: "_dispatch"
      - path: "app/ops/capability/gateway.py"
        symbol: "_adispatch"

  - from: "precheck"
    to: "probes"
    label: "kind=mcp|sandbox|cli（若已 register）"
    mark: "?>"
    type: "branches"
    anchors:
      - path: "app/ops/capability/probes.py"
        symbol: "register_p2_probes"

  - from: "precheck"
    to: "skill_stub"
    label: "kind=skill → provide/invoke stub"
    mark: "?>"
    type: "branches"
    anchors:
      - path: "app/ops/capability/gateway.py"
        symbol: "provide"

  - from: "circuit"
    to: "fallback"
    label: "[open/异常 trigger → 降级判定]"
    mark: "?>"
    type: "branches"
    anchors:
      - path: "app/ops/capability/fallback.py"
        symbol: "should_degrade"

  - from: "fallback"
    to: "result"
    label: "降级输出（degraded 标记 · ok=True 须同看标记）"
    anchors:
      - path: "app/ops/capability/gateway.py"
        symbol: "_degraded_result"

  - from: "obs_admin"
    to: "idempotency"
    label: "只读快照（不经过 invoke）"
    type: "depends_on"
    anchors:
      - path: "app/ops/admin/capability.py"

  - from: "redlines"
    to: "invoke"
    label: "R0–R15 行为红线（黑盒题集）"
    type: "depends_on"

  - from: "local_fn"
    to: "pg_lookup"
    label: "async lookup（P-13 ainvoke）"
    mark: "?>"
    type: "branches"
    anchors:
      - path: "app/ops/capability/lookups.py"
        symbol: "get_issue_by_number"

  - from: "pg_lookup"
    to: "result"
    label: "摘要字段（无 raw_payload）"
    anchors:
      - path: "app/ops/capability/lookups.py"
        symbol: "get_issue_by_number"

  - from: "local_fn"
    to: "result_contract"
    label: "执行输出过契约"
    anchors:
      - path: "app/ops/capability/gateway.py"
        symbol: "_ok_result"

  - from: "result_contract"
    to: "result"
    label: "ok / result_contract_violated"
    anchors:
      - path: "app/ops/capability/result_contract.py"
        symbol: "validate"

  - from: "probes"
    to: "result"
    label: "mock 探针结果"

  - from: "skill_stub"
    to: "result"
    label: "stub / NotImplemented → ok=False"

  - from: "result"
    to: "caller"
    label: "写入 subtask_results；未知 id 不垮图"
    anchors:
      - path: "app/ops/lg_rag/multi/nodes.py"
        symbol: "tool_exec_node"

  - from: "register"
    to: "probes"
    label: "显式 register_p2_probes(enabled=…)"
    mark: "?>"
    type: "branches"

  - from: "result"
    to: "lg_rag_doc"
    label: "接入面"

  - from: "caller"
    to: "modules_doc"
    label: "module_id=capability"
