# Harness Verify · 后端 pytest 样例（Python · FastAPI 等）
#
# 用途：复制为 .github/workflows/pytest.yml 并按仓裁剪。
# 金样 POINTER（Ink）：Cyning12/ai-ink-brain-api-python · .github/workflows/pytest.yml
# 本地路径（工作区对照）：ai-ink-brain-api-python/.github/workflows/pytest.yml
#
# 合并前必绿：pytest tests -m "not intent_eval and not intent_benchmark"（按仓调整 marker）

name: pytest

on:
  pull_request:
  push:
    branches:
      - master
      # - production   # 按需启用

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI dummy 环境变量 — 替换为你的 .env.example 文档化变量名
      # 禁止在 workflow 中写入真实密钥
      EXAMPLE_API_KEY: "dummy-ci-key"
      DATABASE_URL: "postgresql+asyncpg://u:p@localhost:5432/test"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install dependencies
        # 用当前解释器解析（避免 uv sync 跨 3.12/3.13 通用解析与 qdrant-client/numpy 冲突）
        run: |
          uv python install 3.11
          uv venv --python 3.11
          uv pip install -r requirements.txt
          uv pip install "pytest>=8.2,<9" "pytest-asyncio>=0.23,<1" "ruff>=0.5,<1"

      - name: Run pytest
        run: .venv/bin/pytest tests -q --tb=short
        # 有 slow/intent marker 时示例：
        # run: .venv/bin/pytest tests -m "not intent_eval and not intent_benchmark" -q --tb=short

      # --- 可选：Ruff / mypy（L2 落地后启用）---
      # - name: Ruff
      #   run: uv run ruff check .
