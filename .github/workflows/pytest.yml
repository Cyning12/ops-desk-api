# Harness Verify · 后端 pytest 样例（Python · FastAPI 等）
#
# 用途：复制为 .github/workflows/pytest.yml 并按仓裁剪。
# 金样 POINTER（Ink）：Cyning12/ai-ink-brain-api-python · .github/workflows/pytest.yml
# 本地路径（工作区对照）：ai-ink-brain-api-python/.github/workflows/pytest.yml
#
# 合并前必绿：pytest tests -m "not intent_eval and not intent_benchmark"（按仓调整 marker）

name: pytest

on:
  pull_request:
  push:
    branches:
      - master
      # - production   # 按需启用

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ci-pytest-pg-service（issue #384）：消除 DB 用例 skip 假绿（ta2 曾被掩盖实证）。
    # pgvector/pgvector:pg16 自带 vector 扩展；uuid-ossp 在 contrib；
    # 迁移 20260715_init_ops_desk.py:23-24 CREATE EXTENSION IF NOT EXISTS 由 superuser 执行。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI dummy 环境变量 — 替换为你的 .env.example 文档化变量名
      # 禁止在 workflow 中写入真实密钥
      EXAMPLE_API_KEY: "dummy-ci-key"
      DATABASE_URL: "postgresql+asyncpg://ops:ops_password@localhost:5432/opsdesk_test"
      # conftest.py:80 换库协议真源；库名 _test 结尾（_assert_test_database 硬断言）
      OPS_TEST_DATABASE_URL: "postgresql+asyncpg://ops:ops_password@localhost:5432/opsdesk_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install dependencies
        # 用当前解释器解析（避免 uv sync 跨 3.12/3.13 通用解析与 qdrant-client/numpy 冲突）
        run: |
          uv python install 3.11
          uv venv --python 3.11
          uv pip install -r requirements.txt
          uv pip install "pytest>=8.2,<9" "pytest-asyncio>=0.23,<1" "ruff==0.15.21"
          # ruff 钉版与 uv.lock 同源（0.15.21 · 维护者签注 m01101 明裁 · FP-7 禁 ">=0.5,<1" 漂移写法）

      # conftest 运行时 CREATE DATABASE 走 template1 默认模板——扩展预建在 template1，
      # 新建测试库自动继承（vector/uuid-ossp 均为 per-database 对象）。
      - name: Prepare PG extensions (template1)
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          PGPASSWORD=ops_password psql -h localhost -U ops -d template1 -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run pytest
        run: .venv/bin/pytest tests -q --tb=short
        # 有 slow/intent marker 时示例：
        # run: .venv/bin/pytest tests -m "not intent_eval and not intent_benchmark" -q --tb=short

      - name: Ruff
        run: .venv/bin/ruff check app tests
