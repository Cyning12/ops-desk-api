name: tech-graph

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # 本 job 只用 npx（npm）；勿启用 packageManager 缓存（会要求 pnpm）
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Compile and check tech graph
        run: ./scripts/graph-compile.sh

      # W5 覆盖检查（一期 warn only）：语义覆盖可观测性，永不 fail job
      # spec: docs/spec/inform-graph-backfill/ci/coverage_check.md
      - name: Graph coverage check (warn only)
        continue-on-error: true
        run: python3 scripts/graph_coverage_check.py || true
