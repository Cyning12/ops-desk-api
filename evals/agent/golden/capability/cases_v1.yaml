                 body_map: {subject: "{{subject}}"}, idempotency_key: "t:{{subject}}",
                 tenant_param: {in: header, name: X-Ops-Tenant},
                 success_when: {path: "$.code", in: [0]}, error_map: {"1001": args_schema_invalid}}
      downstream: {exc: TimeoutError}
      calls:
        - {capability_id: w_once, args: {subject: x},
           ctx: {tenant_id: t1, _host_policy: {allow_write: true}}}
    expect:
      ok: false
      downstream_calls: 1

  - id: sequence_same_key_second_call_does_not_reach_downstream
    scenario: sequence
    setup:
      capabilities:
        - id: w_dup
          kind: http
          description: x
          when_to_use: 题集
          side_effect: write
          hitl: {required: true}
          tenant_scoped: true
