# Capability 层黑盒题集（E3 · v1）
#
# **黑盒的含义是可执行的**：`expect` 只允许引用**出口字段**——
#   visible_ids / hidden / kept_count / anonymous / undeclared_count
#   ok / error_code / error_contains / downstream_calls / duplicated / registered_ids
# 不允许断言内部函数名、内部字段、日志文案。谁重写了 http_generic 的内部实现，
# 这套 case 都不该动。
#
# `expect` 是**子集**比对：只覆盖你想到的字段；没想到的由基线 diff 兜
# （runner --against-baseline）。
#
# 题集自身也有约束：每个 case 的出口面必须**非空**（runner 测试会守），
# 否则"empty == empty"会带来假通过。
version: 1
module: capability
cases:
  # ---------------- 可见集（两层裁剪：kinds 先，visibility 后）----------------

  - id: catalog_anonymous_cannot_see_department_restricted
    scenario: catalog
    setup:
      baseline: true
      capabilities: []
      principal: {}
      register:
        - {id: dept_finance_only, tags: [oa], visibility: {departments: [finance]}}
    expect:
      hidden:
        - {capability_id: dept_finance_only, reason: department_mismatch}
      anonymous: true

  - id: catalog_finance_principal_sees_department_restricted
    scenario: catalog
    setup:
      baseline: true
      capabilities: []
      principal: {departments: [finance, hr]}
      register:
        - {id: dept_finance_only, tags: [oa], visibility: {departments: [finance]}}
    expect:
      visible_ids: [dept_finance_only]
      kept_count: 1

  - id: catalog_untagged_http_is_cropped_by_kinds_not_visibility
    scenario: catalog
    setup:
      baseline: true
      capabilities: []
      principal: {}
      register:
        - {id: untagged_http, tags: [], visibility: {departments: [all]}}
    expect:
      visible_ids: []
      hidden: [] # 没走到可见性判定——被形态裁剪掉了，不该出现在 hidden 里
      kept_count: 0

  # ---------------- 加载期校验：V1–V9（走真实加载器）----------------

  - id: manifest_missing_args_schema_is_rejected
    scenario: manifest
    setup:
      capabilities:
        - id: no_schema
          kind: http
          description: x
          when_to_use: 题集
          side_effect: read
          tags: [oa]
          visibility: {departments: [all]}
          http: {method: GET, base_url: OA_BASE, path: /x, auth: oa_gateway_token,
                 success_when: {path: "$.code", in: [0]}, error_map: {"1001": args_schema_invalid}}
    expect:
      ok: false
      error_code: manifest_invalid
      error_contains: 缺 args_schema

  - id: manifest_write_without_idempotency_key_hits_v1
    scenario: manifest
    setup:
      capabilities:
        - id: w_no_key
          kind: http
          description: x
          when_to_use: 题集
          side_effect: write
          hitl: {required: true}
          tags: [oa]
          visibility: {departments: [all]}
          args_schema: {type: object, properties: {subject: {type: string}}}
          http: {method: POST, base_url: OA_BASE, path: /t, auth: oa_gateway_token,
                 body_map: {subject: "{{subject}}"},
                 success_when: {path: "$.code", in: [0]}, error_map: {"1001": args_schema_invalid}}
    expect:
      ok: false
      error_code: manifest_invalid
      error_contains: V1

