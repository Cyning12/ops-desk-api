          http: {method: GET, base_url: OA_BASE, path: /x, auth: oa_gateway_token,
                 success_when: {path: "$.code", in: [0]}, error_map: {"1001": args_schema_invalid}}
      downstream: {exc: TimeoutError}
      invoke: {capability_id: r_timeout, args: {}}
    expect:
      ok: false
      error_code: upstream_error
      downstream_calls: 2

  # ---------------- 幂等 / 重试纪律（看"次数"）----------------

  - id: sequence_write_timeout_single_downstream_call
    scenario: sequence
    setup:
      capabilities:
        - id: w_once
          kind: http
          description: x
          when_to_use: 题集
          side_effect: write
          hitl: {required: true}
          tenant_scoped: true
          tags: [oa]
