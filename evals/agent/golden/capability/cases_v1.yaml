  - id: manifest_http_without_visibility_hits_v9
    scenario: manifest
    setup:
      capabilities:
        - id: no_vis
          kind: http
          description: x
          when_to_use: 题集
          side_effect: read
          tags: [oa]
          args_schema: {type: object, properties: {}}
          http: {method: GET, base_url: OA_BASE, path: /x, auth: oa_gateway_token,
                 success_when: {path: "$.code", in: [0]}, error_map: {"1001": args_schema_invalid}}
    expect:
