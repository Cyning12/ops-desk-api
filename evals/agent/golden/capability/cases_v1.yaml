          http: {method: GET, base_url: OA_BASE, path: /x, auth: oa_gateway_token,
                 success_when: {path: "$.code", in: [0]}, error_map: {"1001": args_schema_invalid}}
    expect:
      ok: true
      error_code: null
      registered_ids: [good_read]

  # ---------------- 写闸与错误归一 ----------------

  - id: invoke_write_without_host_policy_is_blocked_with_zero_requests
    scenario: invoke
    setup:
      capabilities:
        - id: w_guard
          kind: http
          description: x
          when_to_use: 题集
          side_effect: write
          hitl: {required: true}
          tenant_scoped: true
          tags: [oa]
          visibility: {departments: [all]}
          args_schema: {type: object, required: [subject], properties: {subject: {type: string}}}
          http: {method: POST, base_url: OA_BASE, path: /t, auth: oa_gateway_token,
                 body_map: {subject: "{{subject}}"}, idempotency_key: "t:{{subject}}",
                 tenant_param: {in: header, name: X-Ops-Tenant},
                 success_when: {path: "$.code", in: [0]}, error_map: {"1001": args_schema_invalid}}
      downstream: {payload: {code: 0, data: {ticketId: T-1}}}
      invoke: {capability_id: w_guard, args: {subject: x}, ctx: {tenant_id: t1}}
    expect:
      ok: false
      error_code: policy_blocked
      downstream_calls: 0

  - id: invoke_upstream_business_error_is_normalized
    scenario: invoke
    setup:
      capabilities:
        - id: r_norm
          kind: http
          description: x
          when_to_use: 题集
          side_effect: read
