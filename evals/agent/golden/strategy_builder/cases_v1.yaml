# E2 · strategy_builder 金标最小集
# expect.allowed_capability_ids 与节点出口字段同名；评估器做集合相等
# Builder 无 LLM；candidate_capability_ids 由测试 patch 注入
version: 2026-08-28
module: strategy_builder
cases:
  - id: builder_needs_tool_intersect
    query: "查一下当前 UTC 时间"
    setup:
      intent:
        domain: ops_kb
        needs_tool: true
        needs_skill: false
        is_composite: false
        risk_hint: low
        summary: 查时间
      candidate_capability_ids:
        - utc_now_iso
        - bogus_tool
    expect:
      allowed_capability_ids:
        - utc_now_iso
  # supervisor-first（D3）：builder 不再消费 intent（needs_tool 语义废止）；
  # 基线 visible ∩ candidates 交集即出口——镜像 tests/test_strategy_builder.py 的
  # test_builder_needs_tool_false_still_intersects_candidates。
  - id: builder_no_intent_baseline_intersection
    query: "你好"
    setup:
      candidate_capability_ids:
        - utc_now_iso
        - bogus_tool
    expect:
      allowed_capability_ids:
        - utc_now_iso
