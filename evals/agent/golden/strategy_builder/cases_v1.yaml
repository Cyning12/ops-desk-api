# E2 · strategy_builder 金标最小集
# expect.allowed_capability_ids 与节点出口字段同名；评估器做集合相等
# Builder 无 LLM；candidate_capability_ids 由测试 patch 注入
version: 2026-08-28
module: strategy_builder
cases:
  - id: builder_needs_tool_intersect
    query: "查一下当前 UTC 时间"
    setup:
      intent:
        domain: ops_kb
        needs_tool: true
        needs_skill: false
        is_composite: false
        risk_hint: low
        summary: 查时间
      candidate_capability_ids:
        - utc_now_iso
        - bogus_tool
    expect:
      allowed_capability_ids:
        - utc_now_iso
  - id: builder_needs_tool_false_empty
    query: "你好"
    setup:
      intent:
        domain: general
        needs_tool: false
        needs_skill: false
        is_composite: false
        risk_hint: low
        summary: ""
    expect:
      allowed_capability_ids: []
