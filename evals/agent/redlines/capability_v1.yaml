# Capability 层 · 红线清单（v1）
#
# **红线 ≠ 准确率**。红线是**否决项**：任一条被突破，整体不通过，不能"用别处的高分补"。
#
# 本文件是**清单**（给人看的、可审计的）；实现在 tests/eval/test_capability_redlines.py。
# 两者必须一一对应：
#   - 清单里有、测试里没有 → 「声明了但没实现」→ 测试会 fail
#   - 测试里有、清单里没有 → 「实现了但没记录」→ 测试会 fail
# 这条对齐本身也是一条红线（R0）——否则清单会慢慢变成一张废纸。
#
# 每条红线在测试里都要有**正向断言 + 反向对照**：
#   - 正向：该拦的拦住了
#   - 反向对照：该放行的放行了
# 只做正向会得到**假通过**——"一律拒绝"天然满足"未授权访问被拒绝"。
#
# 依据栏指回这条红线是从哪次真实事故/评审里来的，不是凭空列的。

version: 1
layer: capability
redlines:
  - id: R0
    severity: critical
    statement: 红线清单与实现必须一一对应（声明=实现）
    rationale: 清单漂移后就会变成废纸，而人会继续以为有防护。类比 V7 的死代码教训。
    source: 本文档自身

  - id: R1
    severity: critical
    statement: 无写放行时，任何 side_effect ∈ {write, irreversible} 的能力必须被拒，且下游零请求
    rationale: 写操作失控是最高代价的失败；"拒了但请求已经发出去"等于没拒。
    source: H4 写操作闸

  - id: R2
    severity: critical
    statement: 出站请求不得包含未声明的模板变量，也不得静默渲染成空串
    rationale: 拼出一个"看起来对、其实少了参数"的请求，比直接报错危险得多——错误会静默传到下游。
    source: H4 校验 V5

  - id: R3
    severity: critical
    statement: 对外暴露的错误不得包含下游原始文案，只能是稳定错误码 + 我们自己的详情
    rationale: 一是数据边界（下游可能把内部细节写在错误里），二是模型面对一堆无法决策的字符串。
    source: H4 错误归一 + 联调 D2

  - id: R4
    severity: critical
    statement: 含非 ASCII 参数的写调用必须成功（幂等键须 ASCII 安全化）
    rationale: 这条曾经让**所有含中文参数的写操作全部发不出去**——中文业务场景下写能力等于不可用。
    source: 联调实测（单测参数全 ASCII 所以一直没暴露）

  - id: R5
    severity: critical
    statement: 写操作超时后不得重发（对端被调用次数必须为 1）
    rationale: 超时≠失败。重发会建出第二张单据，且下游没有幂等键时无法挽回。
    source: H4 重试纪律 + 联调 C2b

  - id: R6
    severity: critical
    statement: 出站请求不得经环境代理（除非显式配 OPS_CAPABILITY_HTTP_PROXY）
    rationale: 内网调用被出口代理劫持后表现为一个看不懂的 502，看起来像网络故障，极难排查。
    source: 联调实测

  - id: R7
    severity: critical
    statement: 命中幂等键的那次调用不得再发请求，且不得留下第二条回执
    rationale: 防重的全部意义就在这里；漏一条就等于防重形同虚设。
    source: W5/W6 幂等防重

  - id: R8
    severity: critical
    statement: >-
      防重存储只有异步接口（= 配了 db 持久化）时，写能力的同步 invoke 必须显式失败、
      且下游零请求；同一能力走 ainvoke 必须正常执行并落回执
    rationale: >-
      同步落库会阻塞事件循环，所以 DbIdempotencyStore 只提供异步接口。危险不在"报错"，
      而在**报错的替代方案**：如果同步路径退化成"防重没生效但仍然发请求"，
      一次重试就会建出第二张单据。必须是 fail-closed——拿不到防重判定就不许发请求。
      这条过去只靠运行时报错传达，属于"踩到才知道"，现在把它钉成红线。
    source: 2026-09-20 联调实测（.env 配 OPS_CAPABILITY_PERSISTENCE=db 后写链路 5 项失败）

  - id: R9
    severity: critical
    statement: >-
      幂等命中必须重放上次的业务结果（回执里 captured 的字段），
      不能只回 duplicated=True + 一个回执 id
    rationale: >-
      幂等是"重复调用返回与首次相同的结果"，不只是"没有重复执行"。
      只回 duplicated=True 和一个回执 id，调用方第二次调用拿不到 ticketId/url，
      业务上等于这次调用白干了——防重保住了，可用性丢了。
    source: 2026-09-20 联调 C1c（db 模式下第二次调用 ticketId=None）

  - id: R10
    severity: critical
    statement: >-
      声明了 output_schema 的能力，返回结果不符合契约（缺必填字段 / 条数不足 /
      空且声明为可疑）时必须判失败；未声明契约的能力不得被推测性拦截
    rationale: >-
      工具返回缺字段、类型变了、列表为空，过去**一律 ok=True**——这是唯一一处
      "错了还报成功"的口子：Agent 拿着残缺结果继续规划，整条链路从这里开始错，
      而没有任何环节报错（八问 Q2/Q4 的根因）。
      反向那半句同等重要：契约是**显式声明**出来的，不是系统替你猜的——
      没声明就擅自拦截，等于把"能用"变成"随机不可用"。
    source: 2026-09-20 P0-1 结果契约（八问 Q2/Q4）

  - id: R11
    severity: critical
    statement: >-
      同一会话的调用数 / 写操作数达到上限后必须拦下（下游零请求）；
      kill switch 命中的能力必须全部停用。被闸门拦下的调用**不计入配额**
    rationale: >-
      已有的预算管的是 supervisor 的**步数**，管不了一个会话里打了多少次工具、
      尤其多少次写——幻觉的典型形态是在一步里反复打同一个写能力，代价是重复建单。
      最后半句是这条红线最容易被写错的地方：如果被拒的调用也计数，
      "反复尝试但都被拒"会把配额打满，反而让一次正常调用被误伤——
      兜底变成了另一种形式的不可用。
    source: 2026-09-20 P0-2 会话配额 + kill switch（八问 Q6）

  - id: R12
    severity: critical
    statement: >-
      同一能力连续出现「环境类」失败（不响应 / 5xx / 429）达到阈值后必须熔断：
      后续调用零出网、恢复时长 60s 后放行一次探测，探测成功恢复、失败重新熔断；
      **业务类失败与本地装配问题不得计入熔断**
    rationale: >-
      没有熔断时，下游连续故障的每一次调用都要再付一次完整超时才知道它还挂着：
      慢、放大下游负载（下游在挣扎还继续打）、让重试纪律失效。
      后半句是这条红线最容易被写错的地方——把「用户填错参数」也算失败，
      5 次之后就把一个完全健康的能力停 60s，等于用可用性问题换可用性问题。
      判据必须是**结构化**的（异常上的 cause / http_status），不能解析错误文案。
    source: 2026-09-20 P1 下游熔断（八问 Q3）

  - id: R13
    severity: critical
    statement: >-
      降级必须**显式声明**：未声明 fallback 的能力失败时不得降级（明确失败）；
      已声明且遇到「下游不可用」（transport / 5xx / 429 / circuit_open）时按声明降级，
      结果必须带 degraded 标记（来源 / 动作 / 时间 / 真实原因）；
      **写能力永不降级**；参数错 / 权限 / 业务码失败 / 契约不符不得降级；
      链条深度不得超过声明的 max_depth 且不得成环；
      **降级标记必须写进工具输出本身**（模型看不到 meta，只看输出），
      否则模型会拿着兜底值当真实结果回答
    rationale: >-
      降级与熔断的本质区别是：**熔断是横切的（只判通不通，任何能力一样），
      降级是纵向的（打不通时给什么，每个能力不同）**。所以框架只能做"何时降级、
      怎么标记、链条多深、怎么观测"，**"降级成什么"必须由业务在清单里声明**
      ——框架猜出来的降级结果是静默错误：返回"上次的结果"会把三小时前的数据
      当成实时数据回答，而它长得完全像一次成功。
      三条最容易被写错的地方：① 把业务码失败也降级（换个接口参数还是错的，
      白付一次调用，还把真实错误盖掉）；② 给写能力降级（单据没建就是没建，
      "降级成建了一半"会让用户以为提交了）；      ③ 降级结果不打标记
      （编排层与模型分不清真实结果和兜底结果，没人会来查）。
      最后半句是"打标记"最容易写错的地方：标记打在 meta 上**等于没打**——
      模型只看工具输出，看不到 meta，于是它拿到一个静态兜底值或一份过期缓存，
      当成真实结果写进答复，语气还很确定。所以标记必须**跟着数据走**，
      进 output；进不去的情况（输出不是 mapping）必须报进观测，不能假装没发生。
    source: 2026-09-20 P1 降级链（八问 Q3 下半）
