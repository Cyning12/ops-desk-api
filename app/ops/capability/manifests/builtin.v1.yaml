# 内置 capability 目录（S3 · 九枚默认 local_fn · 对齐 defaults.py）
# 进程内注册表清单；非跨进程注册中心。无密钥字段；仅 Host load 解析。
# args_schema 仅参数形态；业务不变量不进 schema。
# H4：补 side_effect（危险程度与副作用是两个维度）与 when_to_use
#（模型选择依据，不可省——没有它模型只能靠 id 猜）。
# 裁定四（2026-10-09 · testing-write-capability）：字段族增**顶层**
# idempotency_key（非 http 块）——local_fn write 的合法幂等键声明位
#（V7 禁 local_fn 用 http 块）；http 能力仍走 http.idempotency_key。
# 缺省 None=未声明；loader V1 对 write 强制「http 块键 或 顶层键」二选一，
# V8 对 read 对称拦截。本清单九枚全 read，不声明该字段（声明即 V8）。
version: 1
capabilities:
  - id: mock_get_issue_status
    kind: local_fn
    description: Mock demo：查询 issue 状态（罐头演示数据 · 非真实仓库 · 真实列表用 query_issues）
    when_to_use: 需要查看某个 issue 的当前状态、指派人与更新时间（罐头演示数据）
    when_not_to_use: 需要真实仓库数据时用 get_issue_by_number
    tags: [mock, issue]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: false
    args_schema:
      type: [string, object]
      properties: {}
      additionalProperties: true
    output_fields: [tool, input, issue, status, assignee, updated_at]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.defaults:mock_get_issue_status
  - id: mock_get_deploy_info
    kind: local_fn
    description: Mock demo：查询部署信息（罐头演示数据 · 非真实部署平台 · 仅演示用）
    when_to_use: 需要查看某环境的部署版本、部署时间与健康状态（罐头演示数据）
    when_not_to_use: 需要真实部署平台的实时状态时不要用本能力
    tags: [mock, deploy]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: false
    args_schema:
      type: [string, object]
      properties: {}
      additionalProperties: true
    output_fields: [tool, input, env, version, deployed_at, status]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.defaults:mock_get_deploy_info
  - id: utc_now_iso
    kind: local_fn
    description: 只读：返回当前 UTC ISO 时间戳
    when_to_use: 需要"现在"的绝对时间（例如判断是否超期、计算时间差）
    when_not_to_use: 需要业务日期（如单据日期）时不要用本能力代替
    tags: [readonly, time]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: false
    args_schema:
      type: [string, object, "null"]
      properties: {}
      additionalProperties: true
    output_fields: [tool, utc, note]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.defaults:utc_now_iso
  - id: get_issue_by_number
    kind: local_fn
    description: 本库只读：按 number 查 Issue 摘要（无 raw_payload）
    when_to_use: 用户给了明确的 issue 编号，需要标题、状态等摘要信息
    when_not_to_use: 用户只有关键词、不知道编号时，应先检索再按编号查
    tags: [lookup, issue, readonly]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: true
    args_schema:
      type: [string, object]
      properties:
        number:
          type: [integer, string]
          description: issue/PR 号
      additionalProperties: true
    output_fields: [number, title, state, html_url, updated_at, labels, body]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.lookups:get_issue_by_number
  - id: get_pr_by_number
    kind: local_fn
    description: 本库只读：按 number 查 PR 摘要（无 raw_payload）
    when_to_use: 用户给了明确的 PR 编号，需要标题、状态等摘要信息
    when_not_to_use: 用户只有关键词、不知道编号时，应先检索再按编号查
    tags: [lookup, pr, readonly]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: true
    args_schema:
      type: [string, object]
      properties:
        number:
          type: [integer, string]
          description: issue/PR 号
      additionalProperties: true
    output_fields: [number, title, state, html_url, updated_at, ci_status, draft, body]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.lookups:get_pr_by_number
  - id: query_issues
    kind: local_fn
    description: 只读：分页列出本租户 issue 台账（updated_at 倒序）。过滤：state（open|closed）/label（单标签精确）/scan_status/module（=module_tag）；page 从 1 起，page_size 默认 10 上限 20。返回 items[number,title,state,labels,module_tag,updated_at]+total+page+page_size（不含 body 与内部 id）；单条详情用 get_issue_by_number。
    when_to_use: 需要按状态/标签/模块/扫描状态列出 issue 列表或统计数量时
    tags: [panel, issues, readonly]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: true
    args_schema:
      type: object
      properties:
        state: {type: string, enum: [open, closed]}
        label: {type: string}
        scan_status: {type: string}
        module: {type: string}
        page: {type: integer}
        page_size: {type: integer}
      additionalProperties: false
    output_schema:
      required: ["$.items", "$.total", "$.page", "$.page_size"]
    output_fields: [items, total, page, page_size]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.lookups:query_issues
  - id: query_pull_requests
    kind: local_fn
    description: 只读：分页列出本租户 PR 台账（updated_at 倒序）。过滤：state（open|closed|merged）/ci_status（已知值按 GitHub check 惯例 success|failure|pending；当前 sync 波恒 null，过滤可能命中空集）；page 从 1 起，page_size 默认 10 上限 20。返回 items[number,title,state,draft,ci_status,updated_at]+total+page+page_size（不含 body 与内部 id）；单条详情用 get_pr_by_number。
    when_to_use: 需要按状态或 CI 结果列出 PR 列表或统计数量时
    tags: [panel, pull_requests, readonly]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: true
    args_schema:
      type: object
      properties:
        state: {type: string, enum: [open, closed, merged]}
        ci_status: {type: string}
        page: {type: integer}
        page_size: {type: integer}
      additionalProperties: false
    output_schema:
      required: ["$.items", "$.total", "$.page", "$.page_size"]
    output_fields: [items, total, page, page_size]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.lookups:query_pull_requests
  - id: get_overview
    kind: local_fn
    description: 只读：本租户交付总览聚合（口径对齐面板 overview 端点 · 无参数）。返回 cycle_time/review_time（90 天窗 PR 周期与首评审中位数天数+sample_size，无样本 median_days 为 null）、issue_throughput（30 天关闭数+period_days）、as_of（必带）、sync_status（无同步记录为 idle）、sync_run（最近同步 id/started_at/finished_at/status/records_issue/records_pr，无记录为 null）、scan_snapshot（最近扫描 parsed_summary+created_at，无记录为 null；parsed_summary 序列化超 2000 字符截断为 {keys,truncated:true}）、trend（30 天逐日 closed_issues/merged_prs 零填）。sync_run/scan_snapshot 为全局仓库级状态（无租户列），issue/PR 派生指标按租户过滤。
    when_to_use: 需要交付效率、同步状态、扫描摘要或 30 天趋势的总览数字，或回答「最近整体怎么样」时
    tags: [panel, overview, readonly]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: true
    args_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      required: ["$.cycle_time", "$.review_time", "$.issue_throughput", "$.as_of", "$.sync_status", "$.trend"]
      nullable: ["$.cycle_time.median_days", "$.review_time.median_days", "$.sync_run", "$.scan_snapshot"]
    output_fields: [cycle_time, review_time, issue_throughput, as_of, sync_status, sync_run, scan_snapshot, trend]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.lookups:get_overview
  - id: graph_snapshot
    kind: local_fn
    description: 只读：全局仓库图谱快照三视图（scope 恒为 global_repo · 无租户谓词 · ctx 不要求）。view=summary（默认 · 仅 summary{node_count,edge_count,module_count} · 上限 4000 字符）/modules（附 module_matrix · 上限 8000）/full（附 payload 与 module_matrix · 上限 12000）；module 可选按节点 module 键过滤子图（过滤优先于截断 · 结构不含过滤键时返回 warning=module_filter_no_match 与未过滤摘要，不静默空集）。超限按 nodes→edges 顺序截断并置 truncated=true 且附原始 totals；无快照时 repo_id/created_at/summary 等为 null、truncated=false。
    when_to_use: 需要仓库模块结构、依赖图或模块×问题矩阵的全局视图时
    tags: [panel, graph, readonly]
    risk_level: low
    side_effect: read
    enabled: true
    tenant_scoped: false
    args_schema:
      type: object
      properties:
        view: {type: string, enum: [summary, modules, full]}
        module: {type: string}
      additionalProperties: false
    output_schema:
      required: ["$.view", "$.scope", "$.truncated"]
      nullable: ["$.repo_id", "$.created_at", "$.summary", "$.module_matrix", "$.payload", "$.warning"]
    output_fields: [view, scope, repo_id, created_at, summary, module_matrix, payload, truncated, warning]
    reversible: true
    execution_type: instant
    max_reversal_latency: 0
    requires_stop_support: false
    adapter: local_fn:app.ops.capability.lookups:graph_snapshot
