version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ops_password}
      POSTGRES_DB: opsdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant v1.19.0：对齐 qdrant-client 1.19；稠密读默认；回退 RAG_VECTOR_BACKEND=pgvector
  # 生产目标机 2C4G：建议 mem_limit≈3.5g，留余量给 API/PG；切流前须过 fio/RSS/P95 门禁
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    # 本机容量实验（全内存 80 万）需 ≥8g；生产 compose 仍按 2C4G≈3.5g。
    # deploy.resources.limits.memory: 3584M
    # deploy.resources.limits.cpus: "2.0"
    mem_limit: 8192m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ops:${DB_PASSWORD:-ops_password}@db:5432/opsdesk
      OPS_LLM_PROVIDER: ${OPS_LLM_PROVIDER:-siliconflow}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      OPS_LLM_MODEL: ${OPS_LLM_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      OPS_DESK_SECRET: ${OPS_DESK_SECRET:-change-me}
      OPS_DESK_AUTH_MODE: ${OPS_DESK_AUTH_MODE:-db}
      # 默认 qdrant；回退设 RAG_VECTOR_BACKEND=pgvector
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-qdrant}
      RAG_QDRANT_SHADOW_WRITE: ${RAG_QDRANT_SHADOW_WRITE:-true}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-ops_knowledge}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  qdrant_data:
