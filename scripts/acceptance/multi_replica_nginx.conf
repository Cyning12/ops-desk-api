# 多副本验证 D1 · 降级 LB（SPEC 命名形态：nginx round-robin）
# 诚实标注： vanilla nginx 开源版只支持 ip_hash 亲和（不支持 cookie 亲和）——
# 无亲和组走本 nginx（round-robin 默认）；会话亲和组走自研 Python LB
# （multi_replica_lb.py cookie-sticky），支持面归属在报告里分开标注。
events {}
http {
  upstream mr_api {
    server host.docker.internal:8101;
    server host.docker.internal:8102;
  }
  server {
    listen 8000;
    location / {
      proxy_pass http://mr_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      add_header X-MR-Upstream $upstream_addr always;
    }
  }
}
